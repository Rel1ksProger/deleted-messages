name: Package and Release .plugin

on:
  push:
    branches: [ main ]
    tags:
      - 'v*' # Запускать при пуше тега, например v1.0.0
  workflow_dispatch:

permissions:
  contents: write # Необходимо для создания релиза

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove BOM from source file
        run: |
          sed -i '1s/^\xEF\xBB\xBF//' deleted_messages.py
          
      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp deleted_messages.py dist/deleted_messages.plugin

      - name: Upload .plugin artifact (для вкладки Actions)
        uses: actions/upload-artifact@v4
        with:
          name: deleted_messages-plugin
          path: dist/deleted_messages.plugin
          retention-days: 30

      - name: Create Release and attach .plugin (только для тегов)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/deleted_messages.plugin
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}